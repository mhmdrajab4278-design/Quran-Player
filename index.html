<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div id="card">
        <button id="load">Find Random Ayah</button>
        <div id="pic"></div>
        <audio src="" id="mp3player" loop title="hy">
        </audio>
        <div id="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
            <span id="duration">0:00</span>
        </div>
        <div id="ppcontainer">
            <button id="play"><i class="fa-solid fa-play"></i></button>
            <button id="pause"><i class="fa-solid fa-pause"></i></button>
        </div>

    </div>
    <p id="label" dir="rtl" lang="ar"></p>
    <script src="index.js"></script>
</body>
</html>
